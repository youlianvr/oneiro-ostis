[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oneiro-ostis"
version = "0.2.0.dev1"
description = "Persistent OSTIS assistant — standalone rewrite foundation"
license = "MIT"
requires-python = ">=3.11,<3.15"
dependencies = ["fastapi==0.141.1", "uvicorn==0.41.0"]

[project.optional-dependencies]
graph = ["py-sc-client==0.4.0"]

[project.scripts]
oneiro = "oneiro.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "httpx==0.28.1", "mypy==1.19.1"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["oneiro", "oneiro.*"]

[tool.setuptools.package-data]
# The console's own files, and the compact skill catalog: `oneiro.skills` reads it, so a
# wheel without `assets/` would ship a product whose catalog is not there.
oneiro = ["static/*", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]

[tool.mypy]
python_version = "3.11"
files = ["python/oneiro"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "oneiro.config"
disallow_untyped_defs = false

# `sc_client` and `sc_kpm` are an optional extra that ships no stubs and no `py.typed`,
# and the import is guarded at runtime by `importlib.util.find_spec`. mypy reports the
# untyped import against the *importing* module, and which of `import-untyped` /
# `import-not-found` fires depends on whether this machine has the extra installed — so
# the annotation is scoped to the two modules that reach the graph, and the check means
# the same thing on a machine that has the extra and one that does not. The inline
# `# type: ignore[import-not-found]` this replaces was green only while mypy's cache held
# a result from a run where the extra was absent (found 2026-10-11, 18 errors).
[[tool.mypy.overrides]]
module = ["oneiro.memory", "oneiro.query"]
disable_error_code = ["import-untyped", "import-not-found"]

