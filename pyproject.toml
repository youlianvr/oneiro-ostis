[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oneiro-ostis"
version = "0.2.0.dev1"
description = "Persistent OSTIS assistant — standalone rewrite foundation"
requires-python = ">=3.11,<3.15"
dependencies = ["fastapi==0.141.1", "uvicorn==0.41.0"]

[project.optional-dependencies]
graph = ["py-sc-client==0.4.0"]

[project.scripts]
oneiro = "oneiro.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "httpx==0.28.1", "mypy==1.19.1"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["oneiro", "oneiro.*"]

[tool.setuptools.package-data]
oneiro = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]

[tool.mypy]
python_version = "3.11"
files = ["python/oneiro"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "oneiro.config"
disallow_untyped_defs = false
