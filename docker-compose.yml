services:
  web:
    image: ostis/sc-web:0.9.0
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - sc-machine
    command:
      - "--server-host=machine"
    depends_on:
      machine:
        condition: service_healthy

  machine:
    build:
      context: ./
    restart: unless-stopped
    volumes:
      # Mount KB sources (our ontology + IMS common KB) at the location the
      # entrypoint expects: /knowledge-base. Paths in repo.path resolve
      # relative to the repo.path file itself.
      - ./knowledge-base:/knowledge-base
      - kb-binary:/kb.bin
    networks:
      - sc-machine
    ports:
      - "8090:8090"
    healthcheck:
      test: "/bin/bash -c 'source /example-app/.venv/bin/activate && python3 /example-app/scripts/healthcheck.py'"
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 120s
    environment:
      # Rebuild the KB from sources on every start (repo.path: ontology + IMS base).
      - "REBUILD_KB=1"
      - "KB_PATH=/knowledge-base/repo.path"
      - "BINARY_PATH=/example-app/install/sc-machine/bin"
      - "CONFIG_PATH=/knowledge-base/oneiro-ostis.ini"
      - "EXTENSIONS_PATH=/example-app/build/Release/extensions;/example-app/install/sc-machine/lib/extensions"
      - "SC_SERVER_HOST=0.0.0.0"
      # Deterministic chronological chaining: parallel action processing races
      # on the prev-attempt search and corrupts the nrel_prev_attempt chain.
      - "SC_SERVER_PARALLEL_ACTIONS=0"
    command:
      - "run"

volumes:
  kb-binary: {}

networks:
  sc-machine: {}
