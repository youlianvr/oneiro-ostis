services:
  web:
    image: ostis/sc-web:0.9.0
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - sc-machine
    command:
      - "--server-host=machine"
    depends_on:
      machine:
        condition: service_healthy

  machine:
    build:
      context: ./
    restart: unless-stopped
    volumes:
      - ./:/knowledge-base
      - kb-binary:/kb.bin
    networks:
      - sc-machine
    ports:
      - "8090:8090"
    healthcheck:
      test: "/bin/bash -c 'source /example-app/.venv/bin/activate && python3 /example-app/scripts/healthcheck.py'"
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 120s
    environment:
      - "KB_PATH=/knowledge-base/repo.path"
      - "BINARY_PATH=/example-app/install/sc-machine/bin"
      - "CONFIG_PATH=/knowledge-base/oneiro-ostis.ini"
      - "EXTENSIONS_PATH=/example-app/build/Release/extensions;/example-app/install/sc-machine/lib/extensions"
      - "SC_SERVER_HOST=0.0.0.0"
    command:
      - "run"

volumes:
  kb-binary: {}

networks:
  sc-machine: {}
